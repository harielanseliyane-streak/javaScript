<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
body {
    font-family: Arial;
    background-color: #f2f2f2;
}

.container {
    width: 400px;
    margin: 50px auto;
    background: white;
    padding: 20px;
    border-radius: 10px;
}

input {
    width: 70%;
    padding: 10px;
}

button {
    padding: 10px;
    cursor: pointer;
}

li {
    margin-top: 10px;
    padding: 10px;
    background: #eee;
    list-style: none;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.completed {
    text-decoration: line-through;
    color: gray;
}
#addBtn{
    background: green;
    color: #eee;
}

</style>
<body>
   <div class="container">
        <h1>To-Do List</h1>

        <input type="text" id="taskInput" placeholder="Enter a task">

        <button id="addBtn">Add</button>

        <ul id="taskList"></ul>
    </div>

    <script src="./index.js"></script>
</body>
</html>
